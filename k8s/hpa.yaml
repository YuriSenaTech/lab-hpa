# Mantém a média de CPU dos pods em 50% do request (50% de 20m = 10m).
# Passou disso, cria pod; caiu, remove (até o mínimo).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # O padrão é esperar 5 min antes de reduzir. 1 min deixa o lab mais rápido.
    scaleDown:
      stabilizationWindowSeconds: 60
